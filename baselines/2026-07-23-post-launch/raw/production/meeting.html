    <div id="root"></div>
    <!-- Dedicated mount point for shadcn Dialog/Sheet portals. Sits as a
         sibling of #root so dialog overlays escape any transform / filter
         / perspective / contain / backdrop-filter inside the React tree
         that would otherwise trap their fixed positioning to a smaller
         containing block. See src/components/ui/dialog.tsx.

         The inline style is intentional — keeps the contract obvious at
         the mount point and avoids one more cross-file lookup when this
         is debugged later. position:fixed + inset:0 give the container
         a viewport-sized box so DialogContent's width:100% / max-w-* and
         the overlay's inset-0 resolve against a definite-size parent
         instead of an empty 0×0 div (which is what produced the clipped
         dialog content + visible bisecting border in the prior fix).
         pointer-events:none lets clicks pass through to the page when no
         dialog is open; Radix sets pointer-events:auto inline on the
         active overlay/content so they still receive their own clicks. -->
    <div id="dialog-root" style="position: fixed; inset: 0; pointer-events: none; z-index: 50;"></div>
