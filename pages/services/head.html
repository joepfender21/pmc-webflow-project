/* =====================================================================
   ===== PMC ICON SYSTEM (Services-scoped) =============================
   Shared layer from pmc-icons-shared-layer. Gradients + bloom defs are
   injected once into the DOM via body.html so embeds stay HTML-only.
   Each icon is a self-contained inline SVG with class .pmc-ico i-XXX.
   Animation fires on scroll-in (.go class added by IntersectionObserver),
   replays on hover of the parent card.
   ===================================================================== */
svg.pmc-ico { display: block; width: 40px; height: 40px; max-width: 100%; overflow: visible; }
.pmc-ico .s { fill: none; stroke: url(#gLeaf); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pmc-ico .s2 { fill: none; stroke: #457340; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .36; }
.pmc-ico .sg { fill: none; stroke: url(#gGold); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pmc-ico .hl { fill: none; stroke: rgba(245,240,232,0.5); stroke-width: 0.8; stroke-linecap: round; opacity: .4; }
.pmc-ico .fg { fill: url(#gGold); }
.pmc-ico .fl { fill: url(#gLeaf); }
.pmc-ico .field { stroke: #457340; opacity: .14; fill: none; stroke-width: 1.1; }
.pmc-ico .bloomg { filter: url(#bloomG); }
.pmc-ico .transient { opacity: 0; }

/* i-radar (Attribution blindness leak, Diagnose engagement) */
.pmc-ico.i-radar .sweep { transform-box: view-box; transform-origin: 32px 32px; }
.pmc-ico.i-radar .blip, .pmc-ico.i-radar .ring, .pmc-ico.i-radar .lock { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-radar.go .sweep { animation: pmcRadSweep 1.5s var(--ease-out-expo) both; }
.pmc-ico.i-radar.go .ring { animation: pmcRadRing 1.5s var(--ease-out-expo) .5s both; }
.pmc-ico.i-radar.go .blip { animation: pmcRadBlip 1.5s var(--ease-out-expo) .5s both; }
.pmc-ico.i-radar.go .lock { animation: pmcRadLock 1.4s cubic-bezier(.34,1.4,.5,1) .7s both; }
@keyframes pmcRadSweep { 0% { transform: rotate(-30deg); } 100% { transform: rotate(330deg); } }
@keyframes pmcRadRing { 0%, 40% { opacity: 0; transform: scale(.3); } 60% { opacity: .7; } 100% { opacity: 0; transform: scale(2.6); } }
@keyframes pmcRadBlip { 0%, 40% { opacity: 0; transform: scale(.3); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pmcRadLock { 0% { opacity: 0; transform: scale(.6); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }

/* i-ads (Channel mis-spend leak) */
.pmc-ico.i-ads .bar { transform-box: fill-box; transform-origin: bottom; }
.pmc-ico.i-ads .burst { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-ads.go .r1 { animation: pmcAdBar .7s cubic-bezier(.34,1.4,.5,1) .1s both; }
.pmc-ico.i-ads.go .r2 { animation: pmcAdBar .7s cubic-bezier(.34,1.4,.5,1) .24s both; }
.pmc-ico.i-ads.go .r3 { animation: pmcAdBar .7s cubic-bezier(.34,1.4,.5,1) .38s both; }
.pmc-ico.i-ads.go .r4 { animation: pmcAdBar .7s cubic-bezier(.34,1.4,.5,1) .52s both; }
.pmc-ico.i-ads.go .trend { animation: pmcAdTrend .9s var(--ease-out-expo) .55s both; }
.pmc-ico.i-ads.go .head { animation: pmcAdFade .4s var(--ease-out-expo) 1.25s both; }
.pmc-ico.i-ads.go .burst { animation: pmcAdBurst .7s var(--ease-out-expo) 1.2s both; }
@keyframes pmcAdBar { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
@keyframes pmcAdTrend { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
@keyframes pmcAdFade { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes pmcAdBurst { 0% { opacity: 0; transform: scale(.2); } 55% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(2); } }

/* i-scan (Audit engagement) */
.pmc-ico.i-scan .lens { transform-box: view-box; transform-origin: 31px 30px; }
.pmc-ico.i-scan .beam { transform-box: view-box; }
.pmc-ico.i-scan .ping { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-scan .flag { stroke: url(#gGold); opacity: 1; }
.pmc-ico.i-scan.go .lens { animation: pmcSBob 1.6s var(--ease-out-expo) both; }
.pmc-ico.i-scan.go .beam { animation: pmcSBeam 1.6s var(--ease-out-expo) both; }
.pmc-ico.i-scan.go .ping { animation: pmcSPing 1.6s var(--ease-out-expo) .7s both; }
.pmc-ico.i-scan.go .flag { animation: pmcSFlag 1.6s var(--ease-out-expo) both; }
@keyframes pmcSBob { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(1.5px,-1.5px); } }
@keyframes pmcSBeam { 0% { transform: translateY(-7px); opacity: 0; } 18% { opacity: .85; } 50% { transform: translateY(7px); opacity: .85; } 78% { opacity: 0; } 100% { transform: translateY(7px); opacity: 0; } }
@keyframes pmcSPing { 0%, 45% { opacity: 0; transform: scale(.3); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes pmcSFlag { 0%, 45% { stroke: #5FA354; opacity: .5; } 65% { stroke: #D7AF33; opacity: 1; } 100% { stroke: #D7AF33; opacity: 1; } }

/* i-pin (ASO neglect leak) */
.pmc-ico.i-pin .pin { transform-box: view-box; transform-origin: 32px 30px; }
.pmc-ico.i-pin .ripple { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-pin.go .route { animation: pmcPRoute 1s var(--ease-out-expo) .2s both; }
.pmc-ico.i-pin.go .pin { animation: pmcPDrop 1s cubic-bezier(.34,1.4,.5,1) both; }
.pmc-ico.i-pin.go .ripple { animation: pmcPRipple 1.2s ease-out 1s both; }
.pmc-ico.i-pin.go .ripple.r2 { animation-delay: 1.35s; }
@keyframes pmcPRoute { 0% { stroke-dashoffset: 44; } 100% { stroke-dashoffset: 0; } }
@keyframes pmcPDrop { 0% { opacity: 0; transform: translateY(-6px); } 45% { opacity: 1; } 65% { transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes pmcPRipple { 0%, 25% { opacity: 0; transform: scale(.3); } 45% { opacity: .7; } 100% { opacity: 0; transform: scale(1); } }

/* i-cast (Overlapping software leak, Run engagement) */
.pmc-ico.i-cast .wave, .pmc-ico.i-cast .ep, .pmc-ico.i-cast .core { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-cast.go .core { animation: pmcCaCore 1s var(--ease-out-expo) both; }
.pmc-ico.i-cast.go .v1 { animation: pmcCaWave 1.3s ease-out .25s both; }
.pmc-ico.i-cast.go .v2 { animation: pmcCaWave 1.3s ease-out .5s both; }
.pmc-ico.i-cast.go .v3 { animation: pmcCaWave 1.3s ease-out .75s both; }
.pmc-ico.i-cast.go .e1 { animation: pmcCaEp 1s var(--ease-out-expo) .55s both; }
.pmc-ico.i-cast.go .e2 { animation: pmcCaEp 1s var(--ease-out-expo) .7s both; }
.pmc-ico.i-cast.go .e3 { animation: pmcCaEp 1s var(--ease-out-expo) .85s both; }
.pmc-ico.i-cast.go .e4 { animation: pmcCaEp 1s var(--ease-out-expo) 1s both; }
@keyframes pmcCaCore { 0% { opacity: .7; transform: scale(.82); } 55% { opacity: 1; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pmcCaWave { 0% { opacity: 0; transform: scale(.3); } 28% { opacity: .85; } 100% { opacity: 0; transform: scale(1); } }
@keyframes pmcCaEp { 0%, 35% { fill: #071312; transform: scale(1); } 55% { fill: #D7AF33; transform: scale(1.35); } 100% { fill: #071312; transform: scale(1); } }

/* i-web (Install engagement) */
.pmc-ico.i-web .b1, .pmc-ico.i-web .b2, .pmc-ico.i-web .b3 { transform-box: fill-box; transform-origin: left center; }
.pmc-ico.i-web .b4 { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-web .deploy { transform-box: fill-box; transform-origin: left center; opacity: .5; }
.pmc-ico.i-web.go .b1 { animation: pmcWebWipe .55s cubic-bezier(.34,1.4,.5,1) .15s both; }
.pmc-ico.i-web.go .b2 { animation: pmcWebWipe .55s cubic-bezier(.34,1.4,.5,1) .28s both; }
.pmc-ico.i-web.go .b3 { animation: pmcWebWipe .55s cubic-bezier(.34,1.4,.5,1) .41s both; }
.pmc-ico.i-web.go .b4 { animation: pmcWebPop .6s cubic-bezier(.34,1.4,.5,1) .5s both; }
.pmc-ico.i-web.go .deploy { animation: pmcWebDeploy 1.2s var(--ease-out-expo) .05s both; }
@keyframes pmcWebWipe { 0% { opacity: 0; transform: scaleX(.12); } 100% { opacity: 1; transform: scaleX(1); } }
@keyframes pmcWebPop { 0% { opacity: 0; transform: scale(.4); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pmcWebDeploy { 0% { transform: scaleX(0); opacity: 1; } 66% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: .5; } }

/* i-cal (Diagnose engagement - the scheduled diagnosis call) */
.pmc-ico.i-cal .chip { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-cal .focus { transform-box: fill-box; transform-origin: center; }
.pmc-ico.i-cal.go .c1 { animation: pmcCChip .55s cubic-bezier(.34,1.4,.5,1) .15s both; }
.pmc-ico.i-cal.go .c2 { animation: pmcCChip .55s cubic-bezier(.34,1.4,.5,1) .3s both; }
.pmc-ico.i-cal.go .c3 { animation: pmcCChip .55s cubic-bezier(.34,1.4,.5,1) .45s both; }
.pmc-ico.i-cal.go .c4 { animation: pmcCChip .55s cubic-bezier(.34,1.4,.5,1) .6s both; }
.pmc-ico.i-cal.go .focus { animation: pmcCFocus 1.1s var(--ease-out-expo) .8s both; }
.pmc-ico.i-cal.go .check { animation: pmcCCheck .7s var(--ease-out-expo) 1s both; }
@keyframes pmcCChip { 0% { opacity: 0; transform: scale(.15); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pmcCFocus { 0%, 30% { opacity: 0; transform: scale(.5); } 55% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
@keyframes pmcCCheck { 0% { stroke-dashoffset: 11; } 100% { stroke-dashoffset: 0; } }

/* Continuous float - matches Home's .svc .pmc-ico pmcFloat animation so icons feel "alive" */
.pmc-services .pmc-ico { animation: pmcFloat 3.6s ease-in-out infinite; }
@keyframes pmcFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* Per-context icon sizing on Services (bumped to 56px to match Home's .svc .pmc-ico size) */
.pmc-services .pmc-leak-card .pmc-ico { width: 56px; height: 56px; margin-bottom: 12px; }
.pmc-services .pmc-engage-card .pmc-ico { width: 56px; height: 56px; margin-bottom: 8px; }

@media (prefers-reduced-motion: reduce) {
  .pmc-ico * { animation: none !important; }
  .pmc-ico { animation: none !important; }
  .pmc-ico .transient { opacity: 0 !important; }
  .pmc-ico .trend, .pmc-ico .check { stroke-dashoffset: 0 !important; }
}


/* =====================================================================
   ===== HOME-MATCH FIXES =============================================
   Sec-head subtext stacks BELOW the heading (not in the right rail),
   matching Home's standardized treatment. Per memory: Home's rule is
   .sec-head{flex-wrap:wrap} + .sec-p{flex-basis:100%}.
   ===================================================================== */
.sec-head { flex-wrap: wrap; }
.sec-p { flex-basis: 100%; }


/* =====================================================================
   ===== SERVICES HERO TEMPLATE LAYER ==================================
   Differentiates the hero from Home without removing any functionality.
   - Tree canopy bg replaced with engineering grid + atmospheric leaf/gold
   - 4 gold crop-mark corners injected via body.html
   - Eyebrow gets a 1px gold hairline that draws in on load
   - Section-index strip (injected by body.html) appears below the
     hero-grid as a navigational table of contents
   These selectors live only in Services page head.html so they do not
   leak to other pages.
   ===================================================================== */

/* Schematic hero background - replaces Home's tree canopy with the
   same engineering grid + atmosphere as FIG. 02 Blueprint. !important
   overrides Webflow's Designer-set background on .hero-img. */
.hero { background: var(--bg-deep) !important; position: relative !important; }

.hero-img {
  background-color: var(--bg-deep) !important;
  background-image: radial-gradient(circle at 1px 1px, rgba(245,240,232,0.05) 1px, transparent 1px) !important;
  background-size: 24px 24px !important;
  background-position: 0 0 !important;
  background-repeat: repeat !important;
  opacity: 1 !important;
  filter: none !important;
  mix-blend-mode: normal !important;
}

.hero-veil {
  background:
    radial-gradient(900px 700px at 25% 30%, rgba(69,115,64,0.12), transparent 62%),
    radial-gradient(1000px 800px at 78% 70%, rgba(215,175,51,0.07), transparent 58%),
    linear-gradient(180deg, transparent 0%, rgba(2,8,10,0.35) 100%) !important;
  opacity: 1 !important;
  mix-blend-mode: normal !important;
}

/* Crop-mark corners - same engineering-drawing convention as the Blueprint */
.pmc-hero-corner {
  position: absolute;
  width: 24px;
  height: 24px;
  border-color: var(--gold);
  z-index: 3;
  pointer-events: none;
}
.pmc-hero-corner-tl { top: 20px; left: 20px; border-top: 1px solid; border-left: 1px solid; }
.pmc-hero-corner-tr { top: 20px; right: 20px; border-top: 1px solid; border-right: 1px solid; }
.pmc-hero-corner-bl { bottom: 20px; left: 20px; border-bottom: 1px solid; border-left: 1px solid; }
.pmc-hero-corner-br { bottom: 20px; right: 20px; border-bottom: 1px solid; border-right: 1px solid; }

@media (max-width: 768px) {
  .pmc-hero-corner { width: 16px; height: 16px; }
  .pmc-hero-corner-tl, .pmc-hero-corner-tr { top: 12px; }
  .pmc-hero-corner-bl, .pmc-hero-corner-br { bottom: 12px; }
  .pmc-hero-corner-tl, .pmc-hero-corner-bl { left: 12px; }
  .pmc-hero-corner-tr, .pmc-hero-corner-br { right: 12px; }
}

/* Hairline gold rule under the eyebrow - the "install map starts here" mark */
.hero .eyebrow {
  position: relative;
  padding-bottom: 10px;
}
.hero .eyebrow::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  animation: pmcEyebrowRule 720ms var(--ease-out-expo) 320ms forwards;
}
@keyframes pmcEyebrowRule { 0% { width: 0; } 100% { width: 56px; } }

/* Section-index strip - the table-of-contents that defines the template */
.pmc-hero-index {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin-top: 56px;
  padding-top: 32px;
  border-top: 1px solid var(--hairline);
  list-style: none;
}
.pmc-hero-index-item {
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 18px 10px 0;
  margin-right: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-60);
  text-decoration: none;
  border-right: 1px solid var(--hairline-soft);
  transition: color 280ms var(--ease-out-expo);
  position: relative;
}
.pmc-hero-index-item:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
.pmc-hero-index-num {
  color: var(--gold);
  font-weight: 500;
  letter-spacing: 0.10em;
}
.pmc-hero-index-name {
  color: var(--ink-70);
  font-weight: 400;
  letter-spacing: 0.16em;
}
.pmc-hero-index-item:hover .pmc-hero-index-name { color: var(--ink); }
.pmc-hero-index-item:hover .pmc-hero-index-num { color: var(--gold-bright); }
.pmc-hero-index-item:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
  border-radius: 4px;
}

@media (max-width: 900px) {
  .pmc-hero-index { margin-top: 40px; padding-top: 24px; gap: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 12px; }
  .pmc-hero-index::-webkit-scrollbar { display: none; }
  .pmc-hero-index-item { flex-shrink: 0; padding: 8px 14px 8px 0; margin-right: 14px; font-size: 10.5px; }
}

@media (prefers-reduced-motion: reduce) {
  .hero .eyebrow::after { animation: none !important; width: 56px; }
  .pmc-hero-index-item, .pmc-hero-index-name, .pmc-hero-index-num { transition: none !important; }
}


/* =====================================================================
   ===== FIG. 02 / THE BLUEPRINT (Services #system embed) ==============
   Stylized schematic of the installed marketing OS. 6 layer rails
   matching the Stack, components with mono numbering, continuous gold
   signal packets, crop-mark corners, title block, legend, footer.
   ===================================================================== */
.pmc-blueprint {
  position: relative;
  padding: clamp(28px, 4vw, 56px);
  background:
    radial-gradient(circle at 1px 1px, rgba(245,240,232,0.04) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(180deg, rgba(215,175,51,0.018) 0%, transparent 50%, rgba(69,115,64,0.018) 100%),
    var(--bg-deep);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 32px;
  isolation: isolate;
}

/* Crop-mark corners (engineering-drawing look) */
.pmc-bp-corner {
  position: absolute;
  width: 18px;
  height: 18px;
  border-color: var(--gold);
  z-index: 4;
  pointer-events: none;
}
.pmc-bp-corner-tl { top: 12px; left: 12px; border-top: 1px solid; border-left: 1px solid; }
.pmc-bp-corner-tr { top: 12px; right: 12px; border-top: 1px solid; border-right: 1px solid; }
.pmc-bp-corner-bl { bottom: 12px; left: 12px; border-bottom: 1px solid; border-left: 1px solid; }
.pmc-bp-corner-br { bottom: 12px; right: 12px; border-bottom: 1px solid; border-right: 1px solid; }

/* Title block - top-left, architect's signature block */
.pmc-bp-titleblock {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 18px;
  padding-bottom: 24px;
  margin-bottom: 32px;
  border-bottom: 1px dashed rgba(215,175,51,0.18);
  position: relative;
  z-index: 2;
}
.pmc-bp-fig {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  letter-spacing: 0.18em;
  color: var(--gold);
  padding: 6px 12px;
  border: 1px solid var(--gold);
  border-radius: 2px;
  align-self: start;
  font-weight: 500;
}
.pmc-bp-title {
  font-family: 'Clash Display', sans-serif;
  font-weight: 500;
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink);
  grid-row: 1 / 2;
}
.pmc-bp-meta {
  grid-column: 2;
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 8px;
  row-gap: 2px;
  margin: 8px 0 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.pmc-bp-meta dt { color: var(--ink-50); }
.pmc-bp-meta dd { color: var(--ink-80); margin: 0; }

/* Legend - top-right */
.pmc-bp-legend {
  position: absolute;
  top: clamp(36px, 4vw, 64px);
  right: clamp(36px, 4vw, 64px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--ink-60);
  text-transform: uppercase;
  z-index: 3;
}
.pmc-bp-legend-row { display: inline-flex; align-items: center; gap: 8px; }
.pmc-bp-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pmc-bp-dot.leaf { background: var(--leaf-bright); box-shadow: 0 0 0 2px rgba(90,158,84,0.20); }
.pmc-bp-dot.gold { background: var(--gold); box-shadow: 0 0 6px rgba(215,175,51,0.6); }
.pmc-bp-dot.dim { background: transparent; border: 1px dashed rgba(245,240,232,0.30); }

/* Schematic - the layered drawing surface */
.pmc-bp-schematic {
  position: relative;
  display: grid;
  gap: 14px;
  padding: 24px 0;
  z-index: 1;
}

/* Signal packets - continuous gold dots traveling up the spine */
.pmc-bp-signal {
