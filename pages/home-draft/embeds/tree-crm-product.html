<!-- PMC HOMEPAGE - TREE CRM V2 PRODUCT COMPOSITE EMBED (v3 - real assets)
     Replaces existing embed inside #tree-crm > .pmc-container, sibling of pmc-tree-grid.
     Tile aspect ratio cap (16:10 + object-fit cover + object-position top left) is already
     in v6.2 head CSS - no inline style needed for the unusually tall AI Assistant image. -->

<div class="pmc-product-composite">
  <div class="pmc-product-composite-head">
    <span class="pmc-product-composite-eyebrow">
      <span class="pmc-eyebrow-dot" aria-hidden="true"></span>
      WHAT IT ACTUALLY DOES
    </span>
    <h3 class="pmc-product-composite-title">Four surfaces no other CRM ships in one workspace.</h3>
  </div>
  <div class="pmc-product-grid">
    <figure class="pmc-product-tile">
      <div class="pmc-product-tile-eyebrow">AI ASSISTANT</div>
      <div class="pmc-product-tile-img" data-pmc-product="ai-assistant">
        <img src="https://cdn.prod.website-files.com/698f6b2d83529eb0de880884/6a01037778dfc4c77ae07d4f_tree-assistant.avif" alt="Ask Joe planning a chained workflow with three labeled action batches" loading="lazy" />
      </div>
      <figcaption class="pmc-product-tile-caption">
        <span class="pmc-product-tile-caption-dot"></span>
        Ask Joe planning a 5-step founder workflow
      </figcaption>
    </figure>
    <figure class="pmc-product-tile">
      <div class="pmc-product-tile-eyebrow">EVENTS</div>
      <div class="pmc-product-tile-img" data-pmc-product="events">
        <img src="https://cdn.prod.website-files.com/698f6b2d83529eb0de880884/6a010377822db04aee8bd7d6_tree-event-4.avif" alt="Tree CRM public event page with green gradient hero" loading="lazy" />
      </div>
      <figcaption class="pmc-product-tile-caption">
        <span class="pmc-product-tile-caption-dot"></span>
        Paid RSVPs, door-staff magic links, QR check-in
      </figcaption>
    </figure>
    <figure class="pmc-product-tile">
      <div class="pmc-product-tile-eyebrow">COMMUNITIES</div>
      <div class="pmc-product-tile-img" data-pmc-product="communities">
        <img src="https://cdn.prod.website-files.com/698f6b2d83529eb0de880884/6a0103761a222cd057b02e94_tree-community-1.avif" alt="Tree CRM Founders community feed with channels and posts" loading="lazy" />
      </div>
      <figcaption class="pmc-product-tile-caption">
        <span class="pmc-product-tile-caption-dot"></span>
        Channels, posts, members on every contact record
      </figcaption>
    </figure>
    <figure class="pmc-product-tile">
      <div class="pmc-product-tile-eyebrow">COURSES</div>
      <div class="pmc-product-tile-img" data-pmc-product="courses">
        <img src="https://cdn.prod.website-files.com/698f6b2d83529eb0de880884/6a010376f90d787ac229a5ef_tree-community-2.avif" alt="Tree CRM Founders Onboarding course in Classroom tab with module sidebar" loading="lazy" />
      </div>
      <figcaption class="pmc-product-tile-caption">
        <span class="pmc-product-tile-caption-dot"></span>
        Modules, lessons, leaderboards, certificates
      </figcaption>
    </figure>
  </div>
</div>
