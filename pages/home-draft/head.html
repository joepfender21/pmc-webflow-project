/* ===== AUDIT WIDGET PROMINENCE ===== */
[data-pmc-aw] { max-width: 600px !important; margin: 0 auto !important; display: flex !important; flex-direction: column !important; position: relative !important; box-shadow: 0 60px 120px -40px rgba(0,0,0,0.85), 0 0 60px rgba(215,175,51,0.04), inset 0 1px 0 rgba(255,255,255,0.04) !important; isolation: isolate; }
[data-pmc-aw]::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(215,175,51,0.35) 25%, var(--gold) 50%, rgba(215,175,51,0.35) 75%, transparent 100%); z-index: 3; pointer-events: none; border-radius: 18px 18px 0 0; }
[data-pmc-aw] > div:not([data-pmc-aw-stream]):not([data-pmc-aw-input-row]):not([data-pmc-aw-capture]) { order: 1 !important; }
[data-pmc-aw] > [data-pmc-aw-input-row] { order: 2 !important; border-top: 1px solid rgba(245,240,232,0.08) !important; border-bottom: 1px solid rgba(245,240,232,0.08) !important; }
[data-pmc-aw] > [data-pmc-aw-stream] { order: 3 !important; }

[data-pmc-aw].is-scanning [data-pmc-aw-status]::after { content: ' \2022 \2022 \2022'; display: inline-block; margin-left: 6px; letter-spacing: 2px; animation: pmc-aw-dots-blink 1.2s ease-in-out infinite; }

[data-pmc-aw].is-scanning::after { content: ''; position: absolute; left: 0; right: 0; height: 80px; background: linear-gradient(180deg, transparent 0%, rgba(215,175,51,0.06) 40%, rgba(215,175,51,0.10) 50%, rgba(215,175,51,0.06) 60%, transparent 100%); pointer-events: none; animation: pmc-aw-scanline 2.4s ease-in-out infinite; z-index: 2; }
@keyframes pmc-aw-scanline { 0% { top: -80px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }


/* ===== MOTION POLISH ===== */
